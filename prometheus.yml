global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'worker-cpu'
    static_configs:
      - targets: ['worker:8001']          # CPU‑воркер (профиль cpu / по умолчанию)

  - job_name: 'worker-gpu'
    static_configs:
      - targets: ['worker-gpu:8001']      # GPU‑воркер (профиль gpu)

  - job_name: 'gpu'
    static_configs:
      - targets: ['dcgm-exporter:9400']   # метрики GPU (только если запущен)